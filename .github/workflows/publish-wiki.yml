name: Publish Wiki

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Commit message for wiki sync"
        required: false
        default: "docs: sync wiki"
  push:
    branches:
      - main
      - master
    paths:
      - "docs/wiki/**"

permissions:
  contents: write

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync docs/wiki to GitHub Wiki
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          rsync -av --delete --exclude ".git/" docs/wiki/ wiki/

          if [ -z "$(git -C wiki status --porcelain)" ]; then
            echo "No wiki changes to publish."
            exit 0
          fi

          git -C wiki config user.name "${ACTOR}"
          git -C wiki config user.email "${ACTOR}@users.noreply.github.com"

          COMMIT_MSG="${INPUT_MESSAGE}"
          if [ -z "${COMMIT_MSG}" ]; then
            COMMIT_MSG="docs: sync wiki from ${SHA:0:7}"
          fi

          git -C wiki add .
          git -C wiki commit -m "${COMMIT_MSG}"
          git -C wiki push origin master
